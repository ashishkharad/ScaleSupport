[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Disable secrets scanning (Firebase config is public by design, not a secret)
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
